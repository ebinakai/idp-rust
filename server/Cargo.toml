[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.15.6"
axum = "0.8.8"
base64 = "0.22.1"
chrono = "0.4.44"
crypto = { version = "0.1.0", path = "../crypto" }
db_client = { version = "0.1.0", path = "../db_client" }
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
jwt_core = { version = "0.1.0", path = "../jwt_core" }
oauth_flow = { version = "0.1.0", path = "../oauth_flow" }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tower-sessions = "0.15.0"
uuid = { version = "1.23.0", features = ["v4"] }
